[project]
name = "mobile-medical-patient-review"
version = "1.0.0"
description = "A mobile web application for doctors to review DICOM images"
authors = [
    {name = "Kitware"},
]
dependencies = [
    "trame>=3.12",
    "trame-vuetify",
    "trame-vtk",
    "vtk",
    "trame-slicer[standalone]"
]
requires-python = ">=3.9"
readme = "README.rst"
license = {text = "Other"}
keywords = ["Python", "Interactive", "Web", "Application", "Framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
app = [
    "pywebview",
]
jupyter = [
    "jupyterlab",
]
dev = [
    "pre-commit",
    "ruff",
    "pytest >=6",
    "pytest-cov >=3",
    "nox",
]

[project.scripts]
mobile-medical-patient-review = "mobile_medical_patient_review.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
  "/src/mobile_medical_patient_review/**/*.py",
  "/src/mobile_medical_patient_review/**/*.js",
  "/src/mobile_medical_patient_review/**/*.css",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/mobile_medical_patient_review",
]

[tool.ruff]

[tool.ruff.lint]
extend-select = [
    "ARG", # flake8-unused-arguments
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "G",   # flake8-logging-format
    "I",   # isort
    "ICN", # flake8-import-conventions
    "NPY", # NumPy specific rules
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "TCH", # flake8-type-checking
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
]

ignore = [
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "ISC001",  # Conflicts with formatter
    "ANN401",  # Can't use Any typehint
]
isort.required-imports = []
[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]
"src/**" = ["SIM117"]
